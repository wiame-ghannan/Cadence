name: CI

# Run the tests on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # A PostgreSQL container started next to the tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Cadence_test
        ports:
          - 5432:5432
        # Wait until PostgreSQL is ready before running the tests
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values, replacing the .env file that is not in the repository
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/Cadence_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/Cadence_test
      SECRET_KEY: ci-only-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v