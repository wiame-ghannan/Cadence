services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Development password only, override it with POSTGRES_PASSWORD in your .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
      POSTGRES_DB: Cadence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # The database host is "db", the name of the service above
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-cadence}@db:5432/Cadence
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-cadence}@db:5432/Cadence_test
      # Development key only, override it with SECRET_KEY in your .env
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: